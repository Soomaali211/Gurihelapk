<g id="lens"><g transform="translate(24 24) scale(2.72)">
<circle id="tint" cx="43" cy="43" r="29" fill="#FFFFFF" opacity="0"/>
<circle cx="43" cy="43" r="29" fill="none" stroke="url(#gr)" stroke-width="10"/>

<button id="replay" type="button">Dib u ciyaar</button>
<script>
// ---- Wakhtiyada (ilbiriqsi) ----
const HOUSE_T=.55, LENS_T0=.3, LENS_DUR=1.6, POP=.28, END=LENS_T0+LENS_DUR+POP+.2;
const W=837, PAD=24, SC=2.72;
const finalCx=PAD+43*SC;                       // bartamaha muraayadda meesha ugu dambeysa
const startCx=W+(29+5)*SC+W*.1;                // bannaanka midig
const dx=startCx-finalCx;
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const easeIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOut=p=>1-Math.pow(1-p,3);
const lensDx=t=>dx*(1-easeIO(clamp((t-LENS_T0)/LENS_DUR,0,1)));
const chars=[...document.querySelectorAll('.ch')];
// xaraf kasta: goorta muraayadda bartankeedu ka gudubto xarafka
chars.forEach(el=>{const cx=+el.dataset.cx;el.ts=Infinity;for(let t=0;t<=END;t+=.002){if(finalCx+lensDx(t)<=cx){el.ts=t;break}}});
const house=document.getElementById('houseInner'),lens=document.getElementById('lens'),tint=document.getElementById('tint');
function render(t){
  const hp=easeOut(clamp(t/HOUSE_T,0,1));
  house.style.opacity=hp; house.style.transformOrigin='43px 45px'; house.style.transform='scale('+(.8+.2*hp)+')';
  lens.setAttribute('transform','translate('+lensDx(t)+' 0)');
  const tp=clamp((t-LENS_T0-LENS_DUR*.1)/(LENS_DUR*.2),0,1)*(1-clamp((t-(LENS_T0+LENS_DUR*.8))/(LENS_DUR*.2),0,1));
  tint.setAttribute('opacity',(.14*tp).toFixed(3));
  chars.forEach(el=>{const p=easeOut(clamp((t-el.ts)/POP,0,1));el.style.opacity=p;el.style.transform='translateY('+(12*(1-p))+'px) scale('+(.6+.4*p)+')'});
}
let raf=0;
function play(){cancelAnimationFrame(raf);const s=performance.now();const f=n=>{const t=(n-s)/1000;render(t);if(t<END)raf=requestAnimationFrame(f);else render(END)};raf=requestAnimationFrame(f)}
window.seek=t=>{cancelAnimationFrame(raf);render(t)};
document.getElementById('replay').onclick=play;
if(matchMedia('(prefers-reduced-motion: reduce)').matches)render(END);else play();
</script>
