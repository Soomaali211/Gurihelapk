name: Build GuriHel Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed GuriHel APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compute App Version & Signing Config
        id: ver
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NUM=$((400 + GITHUB_RUN_NUMBER))
          PATCH_NUM=$((3 + GITHUB_RUN_NUMBER))
          VERSION_NAME="4.0.${PATCH_NUM}"
          echo "version_code=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_CODE=${BUILD_NUM}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/custom-release.keystore
            echo "ANDROID_KEYSTORE_PATH=custom-release.keystore" >> "$GITHUB_ENV"
          elif [ -f "android/app/gurihel-signing.p12" ]; then
            echo "ANDROID_KEYSTORE_PATH=gurihel-signing.p12" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -storetype PKCS12 -keystore android/app/gurihel-signing.p12 -alias gurihel -keyalg RSA -keysize 2048 -validity 10000 -storepass gurihel2026 -keypass gurihel2026 -dname "CN=GuriHel,O=GuriHel Somaliland,L=Hargeisa,C=SO"
            echo "ANDROID_KEYSTORE_PATH=gurihel-signing.p12" >> "$GITHUB_ENV"
          fi

          echo "ANDROID_KEYSTORE_PASSWORD=${SECRET_STORE_PASS:-gurihel2026}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${SECRET_ALIAS:-gurihel}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${SECRET_KEY_PASS:-gurihel2026}" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle (Vite)
        env:
          VITE_API_BASE_URL: https://ais-pre-fkdyozsv76cejphilj3vft-357698603471.europe-west2.run.app
        run: npm run build

      - name: Sync Capacitor Android assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Verify APK Signature & Version
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          fi
          mkdir -p release-apk
          cp "$APK_PATH" release-apk/GuriHel-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuriHel-android-apk
          path: release-apk/GuriHel-android.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}
          name: GuriHel Android APK (v${{ steps.ver.outputs.version_name }})
          body: |
            GuriHel Android APK (v${{ steps.ver.outputs.version_name }} / Build ${{ steps.ver.outputs.version_code }}) oo diyaar u ah in si toos ah loo install-gareeyo ama loogu update-gareeyo kii hore.
            - **In-Place Update Safe:** Wuxuu leeyahay saxiix (keystore) joogto ah iyo versionCode kordhaya si xogtii hore aanay u lumin.
            - Soo dejiso **`GuriHel-android.apk`** kadibna ku dhufo **Install / Update**.
          files: release-apk/GuriHel-android.apk
          draft: false
          prerelease: false
