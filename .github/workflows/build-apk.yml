name: Build GuriHel Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build GuriHel APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle (Vite)
        env:
          VITE_API_BASE_URL: https://ais-pre-fkdyozsv76cejphilj3vft-357698603471.europe-west2.run.app
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/GuriHel-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuriHel-android-apk
          path: release-apk/GuriHel-android.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: GuriHel Android APK (v4.0.${{ github.run_number }})
          body: |
            GuriHel Android APK oo diyaar u ah in si toos ah loo install-gareeyo.
            - Capacitor Android + React UI + Firebase Firestore & Auth
            - Soo dejiso faylka `GuriHel-android.apk` hoose kadibna ku dhufo Install.
          files: release-apk/GuriHel-android.apk
          draft: false
          prerelease: false
