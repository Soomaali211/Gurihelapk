version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gurihel_postgres
    restart: always
    environment:
      POSTGRES_USER: gurihel
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: gurihel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: gurihel_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
